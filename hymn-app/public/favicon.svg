<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgVignette" cx="50%" cy="46%" r="65%">
      <stop offset="0%" stop-color="#142142" />
      <stop offset="45%" stop-color="#0c142b" />
      <stop offset="80%" stop-color="#060a17" />
      <stop offset="100%" stop-color="#03050c" />
    </radialGradient>
    <radialGradient id="divineGlow" cx="50%" cy="44%" r="48%">
      <stop offset="0%" stop-color="#ffd56b" stop-opacity="0.45" />
      <stop offset="25%" stop-color="#e5a93b" stop-opacity="0.28" />
      <stop offset="55%" stop-color="#b87314" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#0c142b" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="starburstGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="30%" stop-color="#ffea9f" stop-opacity="0.6" />
      <stop offset="70%" stop-color="#e5a93b" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#d97706" stop-opacity="0" />
    </radialGradient>

    <!-- Metallic Gold Gradients -->
    <linearGradient id="goldRimLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff2b3" />
      <stop offset="25%" stop-color="#e8b449" />
      <stop offset="50%" stop-color="#fdf1c2" />
      <stop offset="75%" stop-color="#b67a1a" />
      <stop offset="100%" stop-color="#f5c767" />
    </linearGradient>
    <linearGradient id="goldDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#91590f" />
      <stop offset="50%" stop-color="#5a3404" />
      <stop offset="100%" stop-color="#381e00" />
    </linearGradient>
    <linearGradient id="crossBevelLeft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#ffe385" />
      <stop offset="100%" stop-color="#e5a837" />
    </linearGradient>
    <linearGradient id="crossBevelRight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#bf7d18" />
      <stop offset="60%" stop-color="#8a5308" />
      <stop offset="100%" stop-color="#593402" />
    </linearGradient>

    <!-- Book & Parchment Gradients -->
    <linearGradient id="pageGradLeft" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#d4cbba" />
      <stop offset="15%" stop-color="#f5efe4" />
      <stop offset="85%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#ebe3d3" />
    </linearGradient>
    <linearGradient id="pageGradRight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d4cbba" />
      <stop offset="15%" stop-color="#f5efe4" />
      <stop offset="85%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#ebe3d3" />
    </linearGradient>
    <linearGradient id="ribbonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e11d48" />
      <stop offset="45%" stop-color="#be123c" />
      <stop offset="80%" stop-color="#881337" />
      <stop offset="100%" stop-color="#4c0519" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="sacredShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.75" />
    </filter>
    <filter id="goldGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- ===================================================================== -->
  <!-- 1. BASE BACKGROUND & SACRED CORNERS (Rounded Squircle App Icon) -->
  <!-- ===================================================================== -->
  <rect width="1024" height="1024" rx="224" fill="url(#bgVignette)" />

  <!-- Outer Double Gold Rim -->
  <rect x="28" y="28" width="968" height="968" rx="200" fill="none" stroke="url(#goldRimLight)" stroke-width="8" stroke-opacity="0.9" />
  <rect x="44" y="44" width="936" height="936" rx="184" fill="none" stroke="url(#goldRimLight)" stroke-width="2.5" stroke-opacity="0.45" stroke-dasharray="8 6" />

  <!-- Corner Fleuron Stars -->
  <g fill="url(#goldRimLight)" opacity="0.8">
    <!-- Top Left -->
    <path d="M 120 120 Q 132 132 144 120 Q 132 108 120 120 Z" />
    <circle cx="132" cy="120" r="3.5" />
    <!-- Top Right -->
    <path d="M 904 120 Q 892 132 880 120 Q 892 108 904 120 Z" />
    <circle cx="892" cy="120" r="3.5" />
    <!-- Bottom Left -->
    <path d="M 120 904 Q 132 892 144 904 Q 132 916 120 904 Z" />
    <circle cx="132" cy="904" r="3.5" />
    <!-- Bottom Right -->
    <path d="M 904 904 Q 892 892 880 904 Q 892 916 904 904 Z" />
    <circle cx="892" cy="904" r="3.5" />
  </g>

  <!-- Divine Radial Glow Behind Emblem -->
  <circle cx="512" cy="460" r="420" fill="url(#divineGlow)" />

  <!-- ===================================================================== -->
  <!-- 2. RADIANT RAYS OF HEAVEN (16 Majestic Golden Beams) -->
  <!-- ===================================================================== -->
  <g opacity="0.35" stroke="url(#goldRimLight)" stroke-linecap="round">
    <!-- North -->
    <line x1="512" y1="340" x2="512" y2="120" stroke-width="4.5" />
    <!-- North-East & Diagonals -->
    <line x1="570" y1="355" x2="685" y2="180" stroke-width="3.5" />
    <line x1="615" y1="390" x2="795" y2="245" stroke-width="4" />
    <line x1="645" y1="440" x2="865" y2="335" stroke-width="3" />
    <line x1="655" y1="495" x2="895" y2="445" stroke-width="4" />
    <!-- East -->
    <line x1="650" y1="550" x2="880" y2="560" stroke-width="3" />
    <!-- North-West & Diagonals -->
    <line x1="454" y1="355" x2="339" y2="180" stroke-width="3.5" />
    <line x1="409" y1="390" x2="229" y2="245" stroke-width="4" />
    <line x1="379" y1="440" x2="159" y2="335" stroke-width="3" />
    <line x1="369" y1="495" x2="129" y2="445" stroke-width="4" />
    <!-- West -->
    <line x1="374" y1="550" x2="144" y2="560" stroke-width="3" />
  </g>

  <!-- ===================================================================== -->
  <!-- 3. SACRED OPEN HYMNAL (Three-dimensional gilded book) -->
  <!-- ===================================================================== -->
  <g filter="url(#sacredShadow)">
    <!-- Book Leather Binding Base / Edge Shadow -->
    <path d="M 148 642 C 280 610, 440 635, 512 675 C 584 635, 744 610, 876 642 L 888 676 C 754 644, 584 668, 512 708 C 440 668, 270 644, 136 676 Z"
          fill="url(#goldDark)" />
    <!-- Golden Leaf Fore-edge -->
    <path d="M 142 630 C 278 598, 440 622, 512 662 C 584 622, 746 598, 882 630 L 876 644 C 744 612, 584 637, 512 677 C 440 637, 280 612, 148 644 Z"
          fill="url(#goldRimLight)" opacity="0.9" />

    <!-- Left Open Page -->
    <path d="M 150 628 C 282 596, 442 620, 508 658 L 508 394 C 442 356, 282 332, 150 364 Z"
          fill="url(#pageGradLeft)" stroke="#e4dbcd" stroke-width="2" />

    <!-- Right Open Page -->
    <path d="M 516 658 C 582 620, 742 596, 874 628 L 874 364 C 742 332, 582 356, 516 394 Z"
          fill="url(#pageGradRight)" stroke="#e4dbcd" stroke-width="2" />

    <!-- Center Deep Book Crease / Shadow -->
    <path d="M 508 394 Q 512 400 516 394 L 516 658 Q 512 664 508 658 Z" fill="#2d2215" opacity="0.65" />

    <!-- Gilded Gold Page Edge Lines -->
    <path d="M 150 364 C 282 332, 442 356, 508 394" fill="none" stroke="url(#goldRimLight)" stroke-width="6" stroke-linecap="round" />
    <path d="M 516 394 C 582 356, 742 332, 874 364" fill="none" stroke="url(#goldRimLight)" stroke-width="6" stroke-linecap="round" />

    <!-- Fine Devotional Hymn Lyrics & Musical Staves (Left Page) -->
    <g stroke="#9c8c76" stroke-width="3" stroke-linecap="round" opacity="0.45">
      <line x1="210" y1="410" x2="445" y2="435" />
      <line x1="210" y1="432" x2="445" y2="457" />
      <line x1="210" y1="454" x2="445" y2="479" />

      <line x1="210" y1="495" x2="445" y2="520" />
      <line x1="210" y1="517" x2="445" y2="542" />
      <line x1="210" y1="539" x2="445" y2="564" />

      <line x1="210" y1="580" x2="380" y2="600" />
    </g>

    <!-- Fine Devotional Hymn Lyrics & Musical Staves (Right Page) -->
    <g stroke="#9c8c76" stroke-width="3" stroke-linecap="round" opacity="0.45">
      <line x1="575" y1="435" x2="810" y2="410" />
      <line x1="575" y1="457" x2="810" y2="432" />
      <line x1="575" y1="479" x2="810" y2="454" />

      <line x1="575" y1="520" x2="810" y2="495" />
      <line x1="575" y1="542" x2="810" y2="517" />
      <line x1="575" y1="564" x2="810" y2="539" />

      <line x1="575" y1="600" x2="745" y2="580" />
    </g>

    <!-- Crimson Silk Liturgical Bookmark Ribbon -->
    <path d="M 506 650 Q 512 660 518 650 L 526 775 L 512 755 L 498 775 Z"
          fill="url(#ribbonGrad)" filter="url(#sacredShadow)" />
    <!-- Ribbon Gold Thread Tip -->
    <line x1="500" y1="772" x2="524" y2="772" stroke="url(#goldRimLight)" stroke-width="2.5" />
  </g>

  <!-- ===================================================================== -->
  <!-- 4. THE GLORIOUS BEVELED GOLDEN CROSS (Sacred Centerpiece) -->
  <!-- ===================================================================== -->
  <g filter="url(#sacredShadow)">
    <!-- Vertical Cross Beam (Left Bevel: Highlight) -->
    <path d="M 494 180 L 512 180 L 512 430 L 494 430 Z" fill="url(#crossBevelLeft)" />
    <!-- Vertical Cross Beam (Right Bevel: Shading) -->
    <path d="M 512 180 L 530 180 L 530 430 L 512 430 Z" fill="url(#crossBevelRight)" />

    <!-- Cross Top Cap Bevel -->
    <polygon points="494,180 512,166 530,180 512,185" fill="#fff5cc" />

    <!-- Horizontal Cross Beam (Left Arm) -->
    <path d="M 432 254 L 512 254 L 512 272 L 432 272 Z" fill="url(#crossBevelLeft)" />
    <polygon points="432,254 418,263 432,272" fill="#fff9db" />

    <!-- Horizontal Cross Beam (Right Arm) -->
    <path d="M 512 254 L 592 254 L 592 272 L 512 272 Z" fill="url(#crossBevelRight)" />
    <polygon points="592,254 606,263 592,272" fill="#663e07" />

    <!-- Bottom Base Point -->
    <polygon points="494,430 512,442 530,430" fill="#a46914" />

    <!-- Golden Cross Outlines & Burnished Edge -->
    <path d="M 512 166 L 530 180 L 530 254 L 606 263 L 592 272 L 530 272 L 530 430 L 512 442 L 494 430 L 494 272 L 432 272 L 418 263 L 432 254 L 494 254 L 494 180 Z"
          fill="none" stroke="url(#goldRimLight)" stroke-width="3" />
  </g>

  <!-- Cross Intersection Starburst / Brilliant Spark -->
  <g transform="translate(512, 263)">
    <circle cx="0" cy="0" r="38" fill="url(#starburstGlow)" />
    <path d="M 0 -28 Q 0 0 28 0 Q 0 0 0 28 Q 0 0 -28 0 Q 0 0 0 -28 Z" fill="#ffffff" opacity="0.95" />
    <circle cx="0" cy="0" r="4" fill="#ffffff" />
  </g>

  <!-- ===================================================================== -->
  <!-- 5. ELEGANT GOLDEN SCRIPTURAL RIBBON / TYPOGRAPHY -->
  <!-- ===================================================================== -->
  <!-- Majestic Banner Base Ribbon -->
  <g filter="url(#sacredShadow)">
    <path d="M 230 830 L 794 830 Q 820 830 832 854 L 848 886 Q 856 902 840 914 L 814 914 Q 798 914 788 900 L 780 888 L 244 888 L 236 900 Q 226 914 210 914 L 184 914 Q 168 902 176 886 L 192 854 Q 204 830 230 830 Z"
          fill="url(#goldDark)" stroke="url(#goldRimLight)" stroke-width="3" />
    <!-- Banner Front Plaque -->
    <rect x="236" y="834" width="552" height="60" rx="14" fill="#0b1329" stroke="url(#goldRimLight)" stroke-width="2" />
  </g>

  <!-- Banner Text: PSALMS & HYMNS -->
  <text x="512" y="874"
        text-anchor="middle"
        font-family="'Plus Jakarta Sans', 'Cinzel', 'Trajan Pro', 'Georgia', serif"
        font-size="34"
        font-weight="800"
        letter-spacing="9"
        fill="url(#goldRimLight)"
        filter="url(#goldGlow)">
    PSALMS &amp; HYMNS
  </text>

  <!-- Subtitle Tag: SACRED COMPANION -->
  <text x="512" y="934"
        text-anchor="middle"
        font-family="'Plus Jakarta Sans', 'Lora', 'Georgia', serif"
        font-size="16"
        font-weight="600"
        letter-spacing="5"
        fill="#b8c6e5"
        opacity="0.85">
    500 SACRED SONGS &amp; SPIRITUAL PSALMS
  </text>
</svg>
